<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Clone - UI Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <!-- Login Card -->
    <section class="login-card">
      <!-- Instagram logo (inline SVG) -->
      <svg class="logo" viewBox="0 0 200 60" aria-label="Instagram">
        <text x="100" y="40" text-anchor="middle"
              font-family="'Grand Hotel', cursive, sans-serif"
              font-size="38" fill="#262626">Instagram</text>
      </svg>

      <form id="login-form" novalidate>
        <div class="input-group">
          <input type="text" id="username" placeholder="Phone number, username, or email" autocomplete="off" />
          <label for="username">Phone number, username, or email</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" placeholder="Password" />
          <label for="password">Password</label>
          <button type="button" id="toggle-password" class="show-hide" hidden>Show</button>
        </div>

        <button type="submit" id="login-btn" class="login-btn" disabled>
          <span class="btn-text">Log in</span>
          <span class="spinner" hidden></span>
        </button>

        <div class="error-msg" id="error-msg" role="alert" hidden></div>
      </form>

      <div class="divider"><span>OR</span></div>

      <a href="#" class="fb-link" id="fb-link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#0095f6">
          <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.971H15.83c-1.491 0-1.956.93-1.956 1.886v2.264h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
        </svg>
        Log in with Facebook
      </a>

      <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>
    </section>

    <!-- Sign up box -->
    <section class="signup-box">
      <p>Don't have an account? <a href="#" id="signup-link">Sign up</a></p>
    </section>

    <!-- Get the app -->
    <section class="app-section">
      <p>Get the app.</p>
      <div class="store-badges">
        <a href="#" aria-label="Download on the App Store">
          <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="App Store" />
        </a>
        <a href="#" aria-label="Get it on Google Play">
          <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Google Play" />
        </a>
      </div>
    </section>

    <footer class="page-footer">
      <p>Demo only — no data is collected or sent anywhere.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
